<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ConnecFriend Messages - Chat privately with friends and other members.">
    <title>ConnecFriend &bull; Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/messages.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark glass-navbar fixed-top" id="mainNavbar">
        <div class="container">
            <a class="navbar-brand brand-nav" href="home.html">
                <i class="bi bi-people-fill me-2"></i>ConnecFriend
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <form class="d-flex mx-auto my-2 my-lg-0 nav-search-form" id="searchForm" onsubmit="return false;">
                    <div class="input-group">
                        <span class="input-group-text glass-input border-end-0"><i class="bi bi-search"></i></span>
                        <input type="search" class="form-control glass-input border-start-0" id="userSearch" placeholder="Search people..." autocomplete="off">
                    </div>
                    <div class="search-results-dropdown d-none" id="searchResults"></div>
                </form>
                <ul class="navbar-nav ms-auto align-items-center gap-1">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html" id="navHome"><i class="bi bi-house-door-fill me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html" id="navProfile"><i class="bi bi-person-fill me-1"></i>Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active position-relative" href="messages.html" id="navMessages">
                            <i class="bi bi-chat-dots-fill me-1"></i>Messages
                            <span class="badge bg-danger rounded-pill msg-badge d-none" id="msgBadge">0</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <img src="" alt="avatar" class="nav-avatar rounded-circle" id="navAvatar" width="28" height="28">
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end glass-dropdown">
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
                            <li><a class="dropdown-item text-warning" href="#" id="resetDataBtn"><i class="bi bi-arrow-counterclockwise me-2"></i>Reset Demo Data</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Messages Layout -->
    <div class="container main-content">
        <div class="row g-0 messages-container glass-card overflow-hidden">
            <!-- Conversations List -->
            <div class="col-md-4 col-lg-3 conversations-panel" id="conversationsPanel">
                <div class="p-3 border-bottom border-secondary">
                    <h5 class="fw-bold mb-2"><i class="bi bi-chat-dots-fill me-2"></i>Messages</h5>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text glass-input border-end-0"><i class="bi bi-search"></i></span>
                        <input type="search" class="form-control glass-input border-start-0" id="conversationSearch" placeholder="Search conversations...">
                    </div>
                </div>
                <div class="p-2">
                    <button class="btn btn-gradient btn-sm w-100 mb-2" id="newConversationBtn">
                        <i class="bi bi-plus-circle me-1"></i>New Message
                    </button>
                </div>
                <div class="conversation-list" id="conversationList">
                    <!-- Loaded by JS -->
                </div>
            </div>

            <!-- Chat Area -->
            <div class="col-md-8 col-lg-9 chat-panel" id="chatPanel">
                <!-- No conversation selected -->
                <div class="chat-empty text-center d-flex flex-column align-items-center justify-content-center h-100" id="chatEmpty">
                    <i class="bi bi-chat-square-text display-1 text-muted"></i>
                    <h5 class="text-muted mt-3">Select a conversation</h5>
                    <p class="text-muted small">Choose an existing conversation or start a new one</p>
                </div>

                <!-- Active Chat -->
                <div class="chat-active d-none" id="chatActive">
                    <!-- Chat Header -->
                    <div class="chat-header p-3 d-flex align-items-center gap-3 border-bottom border-secondary">
                        <button class="btn btn-link text-white d-md-none p-0" id="backToConvos">
                            <i class="bi bi-arrow-left fs-5"></i>
                        </button>
                        <img src="" alt="avatar" class="rounded-circle" id="chatAvatar" width="40" height="40">
                        <div class="flex-grow-1">
                            <h6 class="fw-bold mb-0" id="chatName"></h6>
                            <small class="text-muted" id="chatStatus"></small>
                        </div>
                    </div>

                    <!-- Messages -->
                    <div class="chat-messages p-3" id="chatMessages">
                        <!-- Messages loaded by JS -->
                    </div>

                    <!-- Message Input -->
                    <div class="chat-input p-3 border-top border-secondary">
                        <form id="messageForm" class="d-flex gap-2">
                            <input type="text" class="form-control glass-input" id="messageInput" placeholder="Type a message..." autocomplete="off">
                            <button type="submit" class="btn btn-gradient px-3" id="sendMessageBtn">
                                <i class="bi bi-send-fill"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Conversation Modal -->
    <div class="modal fade" id="newConvoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">New Message</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-2">Send a message to any member (friends or non-friends)</p>
                    <input type="text" class="form-control glass-input mb-3" id="newConvoSearch" placeholder="Search for a user...">
                    <div id="newConvoUserList" class="user-select-list">
                        <!-- Loaded by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
